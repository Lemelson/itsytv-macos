name: itsytv
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.itsytv
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Debug-AppStore: debug
  Release: release
  Release-AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: R892A93W42
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  ItsytvCore:
    path: ../itsytv-core

schemes:
  itsytv:
    build:
      targets:
        itsytv: all
        itsytvTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - itsytvTests
    archive:
      config: Release
  itsytv-appstore:
    build:
      targets:
        itsytv: all
        itsytvTests: [test]
    run:
      config: Debug-AppStore
    test:
      config: Debug-AppStore
      targets:
        - itsytvTests
    archive:
      config: Release-AppStore

targets:
  itsytv:
    type: application
    platform: macOS
    sources:
      - path: itsytv
        excludes:
          - "**/*.proto"
          - itsytv.entitlements
          - itsytv-direct.entitlements
    settings:
      base:
        INFOPLIST_FILE: itsytv/Info.plist
        CODE_SIGN_ENTITLEMENTS: itsytv/itsytv.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.itsytv.app
        PRODUCT_NAME: Itsytv
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "17001"
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: itsytv/itsytv-direct.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: itsytv/itsytv-direct.entitlements
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    dependencies:
      - package: ItsytvCore
  # Logic tests without a host app: the menu bar app would start scanning for Apple TVs (and ask
  # for local network access) on every test run. The decision logic in itsytv/Onboarding is plain
  # Foundation, compiled straight into the test bundle.
  itsytvTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: itsytvTests
      - path: itsytv/Onboarding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsytv.app.tests
        GENERATE_INFOPLIST_FILE: true
